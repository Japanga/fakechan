<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Incognito Test Page</title>
    <script>
        async function checkIncognitoAndRedirect() {
            try {
                // Request storage estimation metrics from the browser
                const estimate = await navigator.storage.estimate();
                const quotaInMB = estimate.quota / (1024 * 1024);

                // Threshold heuristic: Incognito mode historically returns a restricted quota (< 120MB)
                // Note: Modern browsers frequently update these values, which may cause false negatives/positives.
                const INCOGNITO_THRESHOLD_MB = 120;

                if (quotaInMB < INCOGNITO_THRESHOLD_MB) {
                    // Redirect to your designated error page
                    window.location.href = "https://japanga.github.io/fakechan/403.html";
                } else {
                    document.getElementById("status").innerText = "Normal browsing mode detected.";
                }
            } catch (error) {
                console.error("Storage estimation failed:", error);
            }
        }

        // Run the check as soon as the window loads
        window.onload = checkIncognitoAndRedirect;
    </script>
</head>
<body>
    <h1>Checking Browser Environment...</h1>
    <p id="status">Please wait while we verify your session.</p>
</body>
</html>
