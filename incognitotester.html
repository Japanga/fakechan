<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Incognito Test Page</title>
    <script>
        async function checkIncognitoAndRedirect() {
            if (navigator.storage && navigator.storage.estimate) {
                try {
                    const estimate = await navigator.storage.estimate();
                    const quotaInMB = estimate.quota / (1024 * 1024);
                    
                    // Incognito mode historically reports a much smaller quota cap (e.g., < 120MB)
                    // Regular browsing modes report much higher limits based on disk size.
                    if (quotaInMB < 120) {
                        window.location.href = "https://japanga.github.io/fakechan/403.html";
                    }
                } catch (e) {
                    console.error("Storage estimation failed:", e);
                }
            }
        }

        // Run check on page load
        window.onload = checkIncognitoAndRedirect;
    </script>
</head>
<body>
    <h1>Checking browser environment...</h1>
    <p>If you are in Incognito mode, you will be redirected automatically.</p>
</body>
</html>
