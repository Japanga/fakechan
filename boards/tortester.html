<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Chrome Exclusive Page</title>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var userAgent = navigator.userAgent;
            
            // Check if Chrome is in the string, and exclude browsers like Edge or Opera 
            // which also include "Chrome" in their user agent strings.
            var isChrome = userAgent.indexOf("Chrome") > -1;
            var isEdge = userAgent.indexOf("Edg") > -1;
            var isOpera = userAgent.indexOf("OPR") > -1;
            
            // Redirect if it's NOT Chrome, or if it is Edge/Opera masquerading as Chrome
            if (!isChrome || isEdge || isOpera) {
                window.location.href = "https://japanga.github.io/fakechan/403.html";
            }
        });
    </script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        .success { color: green; font-size: 24px; }
    </style>
</head>
<body>
    <div class="success">
        <h1>Welcome!</h1>
        <p>You are successfully viewing this page because you are using Google Chrome.</p>
    </div>
</body>
</html>
