<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Device Classification Diagnostics</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .verdict {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .pc-theme { color: #2b6cb0; }
        .mobile-theme { color: #dd6b20; }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1-tier));
            gap: 15px;
            margin-top: 30px;
            text-align: left;
        }
        .metric-box {
            background: #f7fafc;
            padding: 15px;
            border-left: 4px solid #cbd5e0;
            border-radius: 4px;
        }
        .metric-box.pass { border-left-color: #48bb78; }
        .metric-box h4 { margin: 0 0 5px 0; color: #4a5568; }
        .metric-box p { margin: 0; font-family: monospace; font-size: 0.9rem; word-break: break-all; }
        pre {
            background: #2d3748;
            color: #fff;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Device Classification Engine</h1>
        <p>Heuristic diagnostic evaluation matrix using multi-layered browser APIs.</p>
        
        <div id="verdict-display" class="verdict">Analyzing...</div>
        <div id="confidence-display">Calculating engine confidence vectors...</div>

        <div class="metrics-grid" id="metrics-output"></div>
    </div>

    <div style="margin-top: 30px;">
        <h3>Raw Diagnostic Dump</h3>
        <pre id="raw-log"></pre>
    </div>

<script>
class AdvancedDeviceDetector {
    constructor() {
        this.scores = { pc: 0, mobile: 0 };
        this.diagnostics = {};
    }

    async runEvaluation() {
        // Method 1: Modern Client Hints API
        this.evaluateClientHints();

        // Method 2: Legacy Deep User Agent Sniffing
        this.evaluateUserAgent();

        // Method 3: Touch Hardware Capacitance Points
        this.evaluateTouchPoints();

        // Method 4: CSS Interaction Media Query Analysis
        this.evaluatePointerPrecision();

        // Method 5: Legacy Window Orientation Presence
        this.evaluateOrientationAvailability();

        // Finalize state resolution
        return this.compileVerdict();
    }

    evaluateClientHints() {
        // High Accuracy Detection via modern Sec-CH-UA browser primitives
        if (navigator.userAgentData) {
            const isMobileHint = navigator.userAgentData.mobile;
            this.diagnostics.clientHints = `Supported (mobile flag: ${isMobileHint})`;
            
            if (isMobileHint) {
                this.scores.mobile += 3.5; // Heavily weight modern API feedback
            } else {
                this.scores.pc += 3.5;
            }
        } else {
            this.diagnostics.clientHints = "Not Supported (Fallback Triggered)";
        }
    }

    evaluateUserAgent() {
        const ua = navigator.userAgent;
        this.diagnostics.userAgentRaw = ua;

        // Comprehensive validation strings
        const mobileRegex = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobi|Silk/i;
        
        if (mobileRegex.test(ua)) {
            this.scores.mobile += 2.0;
            this.diagnostics.uaRegex = "Matched Mobile Signatures";
        } else {
            // Check for explicit desktop markers
            if (/Macintosh|Windows NT|Linux x86_64/i.test(ua)) {
                this.scores.pc += 1.5;
                this.diagnostics.uaRegex = "Matched Desktop Architecture";
            } else {
                this.diagnostics.uaRegex = "Indeterminate Signatures";
            }
        }
    }

    evaluateTouchPoints() {
        // Mobile devices overwhelmingly support touch, though exceptions exist (touch laptops)
        const maxTouch = navigator.maxTouchPoints || 0;
        this.diagnostics.maxTouchPoints = maxTouch;

        if (maxTouch > 1) {
            this.scores.mobile += 1.5;
            
            // Sneaky check for modern iPads posing as macOS Desktops
            if (navigator.userAgent.includes("Macintosh") && !("ontouchend" in document)) {
                // True macOS device with a touch profile or custom peripheral
                this.scores.pc += 0.5;
            } else if (navigator.userAgent.includes("Macintosh")) {
                // iPadOS masquerading as macOS Safari
                this.scores.mobile += 2.5; 
                this.diagnostics.maxTouchPoints += " (Detected iPadOS Camouflage)";
            }
        } else {
            this.scores.pc += 2.0;
        }
    }

    evaluatePointerPrecision() {
        // Resolve hardware classification through pointer fine/coarse interactions
        const hasCoarsePointer = window.matchMedia('(any-pointer: coarse)').matches;
        const hasFinePointer = window.matchMedia('(any-pointer: fine)').matches;

        this.diagnostics.pointerType = `Coarse: ${hasCoarsePointer} | Fine: ${hasFinePointer}`;

        if (hasCoarsePointer && !hasFinePointer) {
            // Pure mobile/tablet environment
            this.scores.mobile += 2.5;
        } else if (hasFinePointer && !hasCoarsePointer) {
            // Pure desktop workstation with mouse/trackpad
            this.scores.pc += 2.5;
        } else if (hasCoarsePointer && hasFinePointer) {
            // Hybrid machine (e.g., Microsoft Surface Laptop)
            this.scores.pc += 1.5;
            this.scores.mobile += 0.5;
        }
    }

    evaluateOrientationAvailability() {
        // Historic check; mobile window architectures native binding properties
        const hasOrientationAPI = typeof window.orientation !== 'undefined' || 'orientation' in screen;
        this.diagnostics.orientationAPI = hasOrientationAPI ? "Present" : "Absent";

        if (hasOrientationAPI) {
            this.scores.mobile += 1.0;
        } else {
            this.scores.pc += 0.5;
        }
    }

    compileVerdict() {
        const total = this.scores.pc + this.scores.mobile;
        const pcPercentage = Math.round((this.scores.pc / total) * 100);
        const mobilePercentage = Math.round((this.scores.mobile / total) * 100);

        return {
            verdict: this.scores.pc >= this.scores.mobile ? 'PC' : 'Mobile',
            confidence: this.scores.pc >= this.scores.mobile ? pcPercentage : mobilePercentage,
            scores: this.scores,
            diagnostics: this.diagnostics
        };
    }
}

// Interface Controller Execution Loop
document.addEventListener("DOMContentLoaded", async () => {
    const detector = new AdvancedDeviceDetector();
    const result = await detector.runEvaluation();

    // Render global classification text
    const display = document.getElementById("verdict-display");
    display.textContent = result.verdict;
    display.className = `verdict ${result.verdict === 'PC' ? 'pc-theme' : 'mobile-theme'}`;

    document.getElementById("confidence-display").innerHTML = 
        `Algorithmic Matrix Confidence Level: <strong>${result.confidence}%</strong>`;

    // Process UI grid breakdown metrics
    const grid = document.getElementById("metrics-output");
    const metricsDef = [
        { title: "Client Hints API", data: result.diagnostics.clientHints },
        { title: "UA String Rules Engine", data: result.diagnostics.uaRegex },
        { title: "Hardware Touch Points", data: result.diagnostics.maxTouchPoints },
        { title: "CSS Pointer Hardware Match", data: result.diagnostics.pointerType },
        { title: "Screen Orientation API", data: result.diagnostics.orientationAPI }
    ];

    metricsDef.forEach(item => {
        const box = document.createElement("div");
        box.className = "metric-box pass";
        box.innerHTML = `<h4>${item.title}</h4><p>${item.data}</p>`;
        grid.appendChild(box);
    });

    // Populate the fallback debug elements
    document.getElementById("raw-log").textContent = JSON.stringify(result, null, 4);
});
</script>
</body>
</html>
