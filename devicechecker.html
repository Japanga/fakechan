<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Detection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .result {
            font-size: 24px;
            font-weight: bold;
            color: #007BFF;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Your Device Type:</h1>
        <div id="device-result" class="result">Detecting...</div>
    </div>

    <script>
        function detectDevice() {
            // 1. Modern approach: Check via UserAgentData API (Chromium browsers)
            if (navigator.userAgentData) {
                return navigator.userAgentData.mobile ? "Mobile" : "PC / Desktop";
            }
            
            // 2. Fallback approach: Regular expression check on userAgent string (Safari/Firefox)
            const mobileRegex = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;
            if (mobileRegex.test(navigator.userAgent)) {
                return "Mobile";
            }
            
            // Default to PC if no mobile signature is found
            return "PC / Desktop";
        }

        // Run the function and display the result on the webpage
        document.getElementById("device-result").innerText = detectDevice();
    </script>

</body>
</html>
