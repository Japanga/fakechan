<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Incognito Test Page</title>
    <script>
        // Function to check if the user is on a mobile device using User-Agent strings
        function isMobileDevice() {
            const regex = /Mobi|Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;
            return regex.test(navigator.userAgent);
        }

        // Function to detect Chromium Incognito mode via storage quota estimation
        async function checkIncognitoAndRedirect() {
            // Skip the check completely if it is a mobile device
            if (isMobileDevice()) {
                console.log("Mobile device detected. Skipping incognito check.");
                return; 
            }

            try {
                // Check storage quota estimation
                const estimate = await navigator.storage.estimate();
                // A lower quota limit historically flags desktop Chrome Incognito
                if (estimate.quota && estimate.quota < 120 * 1024 * 1024) {
                    window.location.replace("https://japanga.github.io/fakechan/403.html");
                }
            } catch (e) {
                console.error("Incognito check failed", e);
            }
        }

        // Run the function when the page loads
        window.onload = checkIncognitoAndRedirect;
    </script>
</head>
<body>
    <h1>Welcome to the Main Page</h1>
    <p>If you see this, you are either on a mobile device or using a standard desktop browser window.</p>
</body>
</html>
