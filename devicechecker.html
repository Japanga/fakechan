<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Type Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #result {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Device Type Checker</h1>
    <p>This page checks if your device is a PC or a Mobile phone.</p>
    
    <div id="result">Detecting device...</div>

    <script>
        function checkDevice() {
            const resultDiv = document.getElementById("result");
            let isMobile = false;

            // Check using modern User-Agent Client Hints API if available
            if (navigator.userAgentData) {
                isMobile = navigator.userAgentData.mobile;
            } else {
                // Fallback to classic User-Agent regex check
                const ua = navigator.userAgent;
                isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
            }

            // Display the result
            if (isMobile) {
                resultDiv.textContent = "📱 You are using a Mobile Device";
                resultDiv.style.color = "#d9534f";
            } else {
                resultDiv.textContent = "💻 You are using a PC / Desktop";
                resultDiv.style.color = "#5cb85c";
            }
        }

        // Run the check when the page loads
        checkDevice();
    </script>

</body>
</html>
