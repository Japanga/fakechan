<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Touch Input Detector</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 40px;
            background-color: #f4f7f6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .result-box {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            margin-top: 10px;
        }
        .pc {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .mobile {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        ul {
            line-height: 1.6;
        }
        code {
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>Device Classification Test</h1>
    
    <div class="card">
        <h3>Hardware-Based Evaluation:</h3>
        <div id="classification" class="result-box">Detecting...</div>
    </div>

    <div class="card">
        <h3>Technical Telemetry:</h3>
        <ul>
            <li><strong>Max Touch Points:</strong> <span id="touch-points">Checking...</span></li>
            <li><strong>Media Query <code>(pointer: coarse)</code>:</strong> <span id="media-pointer">Checking...</span></li>
            <li><strong>Legacy <code>ontouchstart</code> Window Object:</strong> <span id="ontouchstart-check">Checking...</span></li>
            <li><strong>Raw User-Agent String:</strong> <span id="ua-string" style="font-size: 0.85rem; word-break: break-all;">Checking...</span></li>
        </ul>
    </div>

    <script>
           async function checkIncognito() {
            // Check if the Storage API is available
            if (navigator.storage && navigator.storage.estimate) {
                const { quota } = await navigator.storage.estimate();
                
                // Chrome sets a strict, small storage quota in Incognito mode.
                // Usually under 120MB, whereas normal mode gets gigabytes.
                const incognitoThreshold = 120 * 1024 * 1024; // 120 Megabytes in bytes

                if (quota < incognitoThreshold) {
                    // Redirect to your custom error page if Incognito is detected
                    window.location.href = 'https://japanga.github.io/fakechan/403.html';
                }
            }
        }
        function checkDeviceCapabilities() {
            // 1. Direct hardware check: number of simultaneous touch points supported
            // Modern desktops generally report 0. Mobile devices and touch PCs report > 0.
            const maxTouchPoints = navigator.maxTouchPoints || 0;

            // 2. Behavioral CSS Media Query check
            // 'coarse' indicates the primary input mechanism is a low-precision pointer (like a finger).
            const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;

            // 3. Legacy Touch Event Check (Fallback verification)
            const supportsTouchStart = ('ontouchstart' in window) || ('DocumentTouch' in window && document instanceof DocumentTouch);

            // Output telemetry to UI
            document.getElementById('touch-points').textContent = maxTouchPoints;
            document.getElementById('media-pointer').textContent = isCoarsePointer ? "True (Finger/Touch)" : "False (Mouse/Trackpad)";
            document.getElementById('ontouchstart-check').textContent = supportsTouchStart ? "Present" : "Absent";
            document.getElementById('ua-string').textContent = navigator.userAgent;

            // Core Logic for classification based on direct touch functionality:
            const classificationEl = document.getElementById('classification');
            
            // If the hardware reports touch capacity and fits coarse navigation mechanics
            if (maxTouchPoints > 0 || isCoarsePointer || supportsTouchStart) {
                // If it passes hardware checks, verify if it's a desktop shell with a touchscreen (like a Surface Pro)
                const isDesktopOS = /Windows NT|Macintosh|Linux x86_64/i.test(navigator.userAgent);
                
                if (isDesktopOS && maxTouchPoints > 0 && !isCoarsePointer) {
                    classificationEl.textContent = "PC (With Touchscreen Capabilities)";
                    classificationEl.className = "result-box pc";
                    checkIncognito;
                } else {
                    classificationEl.textContent = "Mobile / Tablet (With Active Touchscreen)";
                    classificationEl.className = "result-box mobile";
                }
            } else {
                // Standard desktop computers without sensory glass surfaces
                classificationEl.textContent = "Standard PC / Laptop (No Touch Input)";
                classificationEl.className = "result-box pc";
            }
        }

        // Execute function immediately when the DOM contents are ready
        window.addEventListener('DOMContentLoaded', checkDeviceCapabilities);
    </script>
</body>
</html>
