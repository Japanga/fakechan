<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Tab Enforcement Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 2rem;
            color: #222;
        }
        .error-box {
            background-color: #fee2e2;
            border: 1px solid #ef4444;
            padding: 2rem;
            border-radius: 8px;
            max-width: 500px;
            margin: 3rem auto;
            display: none;
        }
        .content-box {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Main App Content -->
    <div id="main-content" class="content-box">
        <h1>Welcome</h1>
        <p>This page is active. If you open another copy of this tab on your device, this window will show an error.</p>
    </div>

    <!-- Error View (Hidden by default) -->
    <div id="error-content" class="error-box">
        <h1>Access Denied</h1>
        <p>You have more than one copy of this tab open. Please close the extra tab to continue using this page.</p>
    </div>

    <script>
        const CHANNEL_NAME = 'single_tab_test_channel';
        const STORAGE_KEY = 'single_tab_active_instance';
        
        // Generate a unique ID for this specific tab instance
        const tabId = Math.random().toString(36).substring(2);
        let channel = null;

        function triggerError() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('error-content').style.display = 'block';
        }

        // Initialize communication cross-tab/cross-window
        if (window.BroadcastChannel) {
            channel = new BroadcastChannel(CHANNEL_NAME);
            
            // Tell existing tabs a new tab just loaded
            channel.postMessage({ type: 'CHECK_PRESENCE', id: tabId });

            // Listen for signals from other tabs
            channel.onmessage = (event) => {
                if (event.data.type === 'CHECK_PRESENCE' && event.data.id !== tabId) {
                    // Another tab announced itself, reply that we are already here
                    channel.postMessage({ type: 'ACK_PRESENCE', id: tabId });
                    triggerError();
                }
                if (event.data.type === 'ACK_PRESENCE' && event.data.id !== tabId) {
                    // An existing tab replied to our announcement
                    triggerError();
                }
            };
        }

        // Fallback / reinforcement using localStorage for mobile browsers with weak BroadcastChannel lifecycles
        window.addEventListener('storage', (event) => {
            if (event.key === STORAGE_KEY && event.newValue) {
                const activeData = JSON.parse(event.newValue);
                if (activeData.id !== tabId) {
                    triggerError();
                }
            }
        });

        // Register current tab on load
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ id: tabId, time: Date.now() }));

        // Clean up storage flag if user closes the primary tab
        window.addEventListener('beforeunload', () => {
            const current = localStorage.getItem(STORAGE_KEY);
            if (current) {
                const parsed = JSON.parse(current);
                if (parsed.id === tabId) {
                    localStorage.removeItem(STORAGE_KEY);
                }
            }
            if (channel) channel.close();
        });
    </script>
</body>
</html>
